# Audio services read configuration from backend/.env:
# docker compose --env-file backend/.env --profile audio up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nihongo
      POSTGRES_USER: nihongo
      POSTGRES_PASSWORD: nihongo_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nihongo -d nihongo"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    user: "0:0"
    profiles: [shadowing]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./backend/shadowing/elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmq_data:/data
  shadowing-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.shadowing
    profiles: [shadowing]
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nihongo:nihongo_local@postgres:5432/nihongo
      SHADOWING_SQS_ENDPOINT: http://elasticmq:9324
      SHADOWING_SQS_QUEUE_URL: ""
      SHADOWING_MODEL_DIR: /models/whisper
      HF_HOME: /models/huggingface
    cpus: 2
    mem_limit: 4g
    volumes:
      - shadowing_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    profiles: [audio]
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "4566:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:2026.8.0}
    profiles: [audio-localstack]
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  elasticmq_data:
  shadowing_models:
  postgres_data:
  localstack_data:
  rustfs_data:
