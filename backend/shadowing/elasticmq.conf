include classpath("application.conf")
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}
messages-storage {
  enabled = true
}
queues {
  shadowing {
    defaultVisibilityTimeout = 2460 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "shadowing-dlq"
      maxReceiveCount = 3
    }
  }
  shadowing-dlq {}
}
