name: NihonGO beta

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [develop, staging]

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAME_REDIS_URL: ''
      GAME_TIMERS_ENABLED: '0'
      HANDWRITING_CHECKPOINT: /nonexistent
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/shadowing/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt -r backend/shadowing/requirements.txt
      - name: Validate backend
        run: |
          python -m compileall -q backend
          python -m unittest tests.test_beta_daily tests.test_beta_ai tests.test_gemini_live_gateway tests.test_local_audio_storage tests.test_games tests.test_game_speech tests.test_shadowing tests.test_translation tests.test_speaking_ai tests.test_writing tests.test_writing_rubric -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --watch=false --silent
      - name: Build beta web
        run: npm run web:build
        env:
          VITE_BETA_MODE: 'true'
          VITE_BETA_LIVE_MODE: 'true'
          VITE_BETA_AUDIO_STORAGE_MODE: 'true'
          VITE_BETA_GAMES_MODE: 'true'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: nihongo-beta-vps
      cancel-in-progress: false
    env:
      BETA_DEPLOY_PRIVATE_KEY: ${{ secrets.BETA_DEPLOY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build beta web
        run: npm run web:build
        working-directory: frontend
        env:
          VITE_BETA_MODE: 'true'
          VITE_BETA_LIVE_MODE: 'true'
          VITE_BETA_AUDIO_STORAGE_MODE: 'true'
          VITE_BETA_GAMES_MODE: 'true'
      - name: Pack and upload release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BETA_DEPLOY_PRIVATE_KEY" ]]; then
            echo '::error::Add BETA_DEPLOY_PRIVATE_KEY to GitHub Actions repository secrets.'
            exit 1
          fi
          keyfile="$RUNNER_TEMP/nihongo_deploy_key"
          umask 077
          printf '%s\n' "$BETA_DEPLOY_PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          bundle="$RUNNER_TEMP/nihongo-${GITHUB_SHA}.tar.gz"
          OUTPUT_PATH="$bundle" bash deploy/beta/build_bundle.sh
          digest="$(sha256sum "$bundle" | cut -d ' ' -f 1)"
          ssh_args=(-i "$keyfile" -o BatchMode=yes -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile=deploy/beta/known_hosts)
          rsync -az -e "ssh -i $keyfile -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/beta/known_hosts" \
            "$bundle" "nihongo-deploy@178.238.231.247:/home/nihongo-deploy/incoming/${GITHUB_SHA}.tar.gz"
          ssh "${ssh_args[@]}" nihongo-deploy@178.238.231.247 \
            sudo -n /usr/local/sbin/nihongo-deploy "$GITHUB_SHA" "$digest"
