name: NihonGO beta

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [develop, staging]

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: nihongo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nihongo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GAME_REDIS_URL: ''
      GAME_TIMERS_ENABLED: '0'
      HANDWRITING_CHECKPOINT: /nonexistent
      PYTHONPATH: backend:backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/shadowing/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt -r backend/shadowing/requirements.txt
      - name: Validate backend
        run: |
          python -m compileall -q backend
          python -m unittest tests.test_beta_env tests.test_beta_daily tests.test_beta_ai tests.test_gemini_live_gateway tests.test_local_audio_storage tests.test_games tests.test_game_speech tests.test_shadowing tests.test_translation tests.test_speaking_ai tests.test_writing tests.test_writing_rubric -q
      - name: Validate authentication and final beta seat on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/nihongo_test
        run: python -m unittest tests.test_auth -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test Pages compatibility routes
        run: node --test ../deploy/beta/test_pages_proxy.mjs
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --watch=false --silent
      - name: Build beta web
        run: npm run web:build
        env:
          VITE_API_ORIGIN: 'https://api.momonihongo.app'
          VITE_BETA_MODE: 'true'
          VITE_BETA_LIVE_MODE: 'true'
          VITE_BETA_AUDIO_STORAGE_MODE: 'true'
          VITE_BETA_GAMES_MODE: 'true'
          VITE_BETA_SPEAKING_MODE: 'true'

      - name: Save verified frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: beta-web-${{ github.sha }}
          path: frontend/dist-web/
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: nihongo-beta-vps
      cancel-in-progress: false
    env:
      BETA_DEPLOY_PRIVATE_KEY: ${{ secrets.BETA_DEPLOY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified frontend build
        uses: actions/download-artifact@v4
        with:
          name: beta-web-${{ github.sha }}
          path: frontend/dist-web
      - name: Pack and upload release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BETA_DEPLOY_PRIVATE_KEY" ]]; then
            echo '::error::Add BETA_DEPLOY_PRIVATE_KEY to GitHub Actions repository secrets.'
            exit 1
          fi
          keyfile="$RUNNER_TEMP/nihongo_deploy_key"
          umask 077
          printf '%s\n' "$BETA_DEPLOY_PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          bundle="$RUNNER_TEMP/nihongo-${GITHUB_SHA}.tar.gz"
          OUTPUT_PATH="$bundle" bash deploy/beta/build_bundle.sh
          digest="$(sha256sum "$bundle" | cut -d ' ' -f 1)"
          ssh_args=(-i "$keyfile" -o BatchMode=yes -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile=deploy/beta/known_hosts)
          rsync -az -e "ssh -i $keyfile -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/beta/known_hosts" \
            "$bundle" "nihongo-deploy@178.238.231.247:/home/nihongo-deploy/incoming/${GITHUB_SHA}.tar.gz"
          ssh "${ssh_args[@]}" nihongo-deploy@178.238.231.247 \
            sudo -n /usr/local/sbin/nihongo-deploy "$GITHUB_SHA" "$digest"

  deploy-pages:
    name: Deploy Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    # Publish the frontend only after the matching backend is healthy.
    needs: [backend, frontend, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: nihongo-cloudflare-pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: 8c6046bc2e034afe2a4f105ee0e1a618
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Pages credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN with Cloudflare Pages Edit permission to repository Actions secrets.'
            exit 1
          fi
      - name: Restore verified frontend build
        uses: actions/download-artifact@v4
        with:
          name: beta-web-${{ github.sha }}
          path: frontend/dist-web
      - name: Deploy verified build to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.165.0'
          command: pages deploy frontend/dist-web --project-name=momonihongo-web --branch=staging --commit-hash=${{ github.sha }} --commit-dirty=false
      - name: Verify public Pages frontend and compatibility API
        run: python3 deploy/beta/verify_pages_deployment.py --directory frontend/dist-web
      - name: Record deployed revision
        shell: bash
        run: |
          echo '### Cloudflare Pages deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revision: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '[momonihongo.app](https://momonihongo.app)' >> "$GITHUB_STEP_SUMMARY"
