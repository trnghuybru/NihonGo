# Example for a web build served from /usr/share/nginx/html.
# Change the upstream address to the backend address in your deployment.
map $http_upgrade $nihongo_connection {
    default upgrade;
    '' close;
}

upstream nihongo_api {
    server 127.0.0.1:5001;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|static|socket\.io)(/|$) {
        proxy_pass http://nihongo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nihongo_connection;
        proxy_read_timeout 120s;
        # Adjust alongside backend upload limits for audio/video uploads.
        client_max_body_size 256m;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter deep links must resolve to the SPA on direct visits/F5.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
